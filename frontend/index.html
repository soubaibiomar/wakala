  <body>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var div = document.createElement('div');
        div.style = 'color:red;z-index:9999;position:fixed;top:0;left:0;background:white;padding:20px;border:2px solid red;width:100%;height:100%;overflow:auto;';
        div.innerHTML = '<h1>Application Error</h1><p>' + msg + '</p><pre>' + (error ? error.stack : '') + '</pre>';
        document.body.appendChild(div);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var div = document.createElement('div');
        div.style = 'color:red;z-index:9999;position:fixed;top:0;left:0;background:white;padding:20px;border:2px solid red;width:100%;height:100%;overflow:auto;';
        div.innerHTML = '<h1>Unhandled Promise Rejection</h1><pre>' + (event.reason ? event.reason.stack || event.reason : event) + '</pre>';
        document.body.appendChild(div);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
