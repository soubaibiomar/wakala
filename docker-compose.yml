# ═══════════════════════════════════════════════════════════════
# Wakala — Docker Compose
# Services: PostgreSQL, Neo4j, Qdrant, Kafka, Scraper Producer
# ═══════════════════════════════════════════════════════════════

services:
  # ─── Ollama ────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: wakala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wakala
      POSTGRES_USER: wakala_user
      POSTGRES_PASSWORD: wakala_secret_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wakala_user -d wakala" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Neo4j ─────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.23-community
    container_name: wakala-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j_secret_password
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
    ports:
      - "127.0.0.1:7474:7474" # Browser
      - "127.0.0.1:7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./database/neo4j/cypher_scripts:/var/lib/neo4j/import
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p neo4j_secret_password 'RETURN 1' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Qdrant ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: wakala-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333" # REST API
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MailHog (Local Email Testing) ───────────────────────────
  mailhog:
    image: mailhog/mailhog
    container_name: wakala-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

  # ─── Zookeeper (required by Kafka) ─────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: wakala-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: [ "CMD-SHELL", "echo srvr | bash -c 'cat > /dev/tcp/localhost/2181'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── Kafka ─────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: wakala-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Scraper Producer (sole Kafka source for listings.raw) ──────
  scraper-producer:
    build:
      context: .
      dockerfile: data_pipeline/Dockerfile
    container_name: wakala-scraper-producer
    restart: "on-failure:3"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      PYTHONPATH: "/app"
      # Set SCRAPER_MODE=live for production, leave unset for dry-run (default)
      SCRAPER_MODE: "live"
      SCHEDULE_INTERVAL_HOURS: "1"
      OLLAMA_BASE_URL: "http://ollama:11434/v1"
      OLLAMA_MODEL_TEXT: "qwen3:8b"
      OLLAMA_MODEL_CODE: "qwen2.5-coder:7b"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "wakala_user"
      POSTGRES_PASSWORD: "wakala_secret_password"
      POSTGRES_DB: "wakala"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    # Run the new unified scraper pipeline continuously
    command: [ "python", "data_pipeline/scrapers/main.py", "--schedule", "--interval", "10" ]

  backend:
    build:
      context: ./backend
    container_name: wakala-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: wakala
      POSTGRES_USER: wakala_user
      POSTGRES_PASSWORD: wakala_secret_password
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_secret_password
      QDRANT_HOST: qdrant
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # MAIL_SERVER: mailhog
      # MAIL_PORT: 1025
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL_TEXT: qwen3:8b
      OLLAMA_MODEL_CODE: qwen2.5-coder:7b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app

  backend-consumer:
    build:
      context: ./backend
    container_name: wakala-backend-consumer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_USER: wakala_user
      POSTGRES_PASSWORD: wakala_secret_password
      POSTGRES_DB: wakala
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: python consume_to_postgres.py
    volumes:
      - ./backend:/app

  backend-scheduler:
    build:
      context: ./backend
    container_name: wakala-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: wakala_user
      POSTGRES_PASSWORD: wakala_secret_password
      POSTGRES_DB: wakala
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_secret_password
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://ollama:11434/v1
    command: python scheduler.py
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: wakala-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  zookeeper_data:
  kafka_data:
  ollama:
    external: true
