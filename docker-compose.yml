# ═══════════════════════════════════════════════════════════════
# AutoMind — Docker Compose
# Services: PostgreSQL, Neo4j, Qdrant, Kafka, Scraper Producer
# ═══════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: automind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: automind
      POSTGRES_USER: automind_user
      POSTGRES_PASSWORD: automind_secret_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automind_user -d automind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Neo4j ─────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.23-community
    container_name: automind-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j_secret_password
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./database/neo4j/cypher_scripts:/var/lib/neo4j/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j_secret_password 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Qdrant ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: automind-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Zookeeper (required by Kafka) ─────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: automind-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  # ─── Kafka ─────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: automind-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Scraper Producer (sole Kafka source for listings.raw) ──────
  scraper-producer:
    build:
      context: .
      dockerfile: data_pipeline/Dockerfile
    container_name: automind-scraper-producer
    restart: "on-failure:3"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      PYTHONPATH: "/app"
      # Set SCRAPER_MODE=live for production, leave unset for dry-run (default)
      SCRAPER_MODE: "dry-run"
    # In dry-run mode (default), no actual HTTP requests are made
    # Set SCRAPER_MODE=live in environment for real scraping
    command: >
      python -m data_pipeline.kafka.producers.scrapers.run_producer
      --dry-run
    # To run live: change command to:
    # command: python -m data_pipeline.kafka.producers.scrapers.run_producer --live
    # To run scheduled:
    # command: python -m data_pipeline.kafka.producers.scrapers.run_producer --live --schedule

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  zookeeper_data:
  kafka_data: