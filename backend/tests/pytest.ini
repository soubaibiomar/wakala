[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

markers =
    unit: Tests unitaires (sans base de donnees ni reseau)
    integration: Tests d'integration (API + DB mockee)
    slow: Tests longs (ML, vision)

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

addopts = -v --tb=short --strict-markers

# Couverture minimale (pytest-cov)
# cov = app/
# cov-report = term-missing
# cov-fail-under = 70
